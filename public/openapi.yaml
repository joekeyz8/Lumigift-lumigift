openapi: 3.0.3
info:
  title: Lumigift API
  description: |
    REST API for Lumigift — time-locked cash gifts on the Stellar blockchain.

    ## Versioning

    All routes are prefixed with `/api/v1/`. Breaking changes (removed fields,
    changed semantics, new required parameters) will be introduced under a new
    version prefix (e.g. `/api/v2/`). Additive, non-breaking changes (new
    optional fields, new endpoints) may be made to the current version.

    The current stable version is **v1**. Every response includes an
    `X-API-Version: 1` header so clients can detect version mismatches.

    ## Authentication

    Most endpoints require a valid NextAuth.js session cookie obtained by
    completing the phone OTP flow:
    1. `POST /api/v1/auth/send-otp` — request a one-time password via SMS.
    2. Sign in via NextAuth credentials (`POST /api/v1/auth/[...nextauth]`).

    Internal cron endpoints require `Authorization: Bearer <CRON_SECRET>`.

    ## Response envelope

    All responses use a consistent JSON envelope:

    **Success:**
    ```json
    { "success": true, "data": { ... } }
    ```
    **Error:**
    ```json
    { "success": false, "error": "Human-readable message", "code": "MACHINE_CODE" }
    ```

    `code` is a machine-readable identifier for client-side error handling.
    See the `ErrorCode` enum in the schemas section for all possible values.

    **Base URL:** `https://www.lumigift.com`
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://www.lumigift.com
    description: Production
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: Phone OTP authentication and session management
  - name: Gifts
    description: Gift lifecycle — create, read, cancel, claim
  - name: Payments
    description: Paystack and Stripe payment webhooks
  - name: Uploads
    description: Media upload helpers
  - name: Cron
    description: Internal scheduler endpoints (Bearer token required)
  - name: Admin
    description: Admin-only gift management and audit log access
  - name: Health
    description: Service health check

paths:
  /api/v1/auth/send-otp:
    post:
      tags: [Auth]
      summary: Send OTP to a phone number
      description: |
        Sends a one-time password via SMS. Always returns the same success body
        regardless of whether the number is registered (prevents enumeration).

        Rate limits: 3 requests per phone per 10 min; 10 requests per IP per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: Phone number in any format — normalised to E.164 internally.
                  example: "+2348012345678"
      responses:
        "200":
          description: OTP sent (or silently dropped if number is not registered)
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: "If this number is registered, an OTP has been sent."
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/report-login:
    get:
      tags: [Auth]
      summary: Report a suspicious login (SMS link)
      description: Called when a user taps the "this wasn't me" link in the login SMS.
      parameters:
        - name: uid
          in: query
          required: true
          schema:
            type: string
        - name: fp
          in: query
          required: true
          schema:
            type: string
            description: Device fingerprint
      responses:
        "200":
          description: Report received
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Auth]
      summary: Report a suspicious login (JSON body)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, fingerprint]
              properties:
                userId:
                  type: string
                fingerprint:
                  type: string
      responses:
        "200":
          description: Report received
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/gifts:
    get:
      tags: [Gifts]
      summary: List gifts sent by the authenticated user
      description: Returns a cursor-paginated list of gifts (10 per page).
      security:
        - sessionCookie: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            description: Opaque pagination cursor from the previous response.
      responses:
        "200":
          description: Paginated gift list
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [gifts, nextCursor]
                        properties:
                          gifts:
                            type: array
                            items:
                              $ref: "#/components/schemas/Gift"
                          nextCursor:
                            type: string
                            nullable: true
                            description: Pass this value as `cursor` on the next request.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Gifts]
      summary: Create a new gift
      description: |
        Creates a gift record and returns a Paystack payment URL.
        The gift status is `pending_payment` until the webhook confirms payment.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGiftRequest"
      responses:
        "201":
          description: Gift created
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [gift, paymentUrl]
                        properties:
                          gift:
                            $ref: "#/components/schemas/Gift"
                          paymentUrl:
                            type: string
                            format: uri
                            description: Paystack payment URL to redirect the user to.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/gifts/{id}:
    get:
      tags: [Gifts]
      summary: Get a gift by ID (public claim view)
      description: Returns a safe subset of gift fields — no sender PII.
      parameters:
        - $ref: "#/components/parameters/GiftId"
      responses:
        "200":
          description: Gift found
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PublicGift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Gifts]
      summary: Cancel a gift
      description: |
        Cancels a gift and triggers a Paystack refund.
        Only the sender can cancel. Only `locked` or `pending_payment` gifts
        can be cancelled, and only before the unlock time.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/GiftId"
      responses:
        "200":
          description: Gift cancelled
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Gift"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/gifts/{id}/claim:
    post:
      tags: [Gifts]
      summary: Claim a gift
      description: |
        Transfers the locked USDC to the recipient's Stellar address.
        Requires the gift to be in `locked` status and past its unlock time.
      parameters:
        - $ref: "#/components/parameters/GiftId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [giftId, recipientStellarKey]
              properties:
                giftId:
                  type: string
                  format: uuid
                recipientStellarKey:
                  type: string
                  description: Recipient's Stellar public key (G...)
                  example: "GABC...XYZ"
      responses:
        "200":
          description: Gift claimed — USDC transferred
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [txHash]
                        properties:
                          txHash:
                            type: string
                            description: Stellar transaction hash of the USDC transfer
                            example: "a5b6c7d8e9..."
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/payments:
    post:
      tags: [Payments]
      summary: Paystack webhook
      description: |
        Receives `charge.success` events from Paystack.
        Signature verified via HMAC-SHA512 (`x-paystack-signature` header).
        Idempotent — duplicate or concurrent event IDs have no side effects
        (protected by atomic Redis SET NX on the payment reference).
      parameters:
        - name: x-paystack-signature
          in: header
          required: true
          schema:
            type: string
            description: HMAC-SHA512 of the raw request body using the Paystack secret key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, data]
              properties:
                event:
                  type: string
                  example: charge.success
                data:
                  type: object
                  required: [reference, status]
                  properties:
                    reference:
                      type: string
                      description: Unique Paystack payment reference
                    status:
                      type: string
                      example: success
                    metadata:
                      type: object
                      properties:
                        giftId:
                          type: string
                          format: uuid
      responses:
        "200":
          description: Event acknowledged (processed or already-seen duplicate)
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    example: true
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid HMAC signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/payments/callback:
    get:
      tags: [Payments]
      summary: Paystack redirect callback
      description: Paystack redirects the user here after payment. Verifies payment and redirects to success or failure page.
      parameters:
        - name: reference
          in: query
          required: true
          schema:
            type: string
            description: Paystack payment reference
        - name: giftId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "302":
          description: Redirect to success (`/gift/{id}/success`) or failure page
        "400":
          description: Missing required query parameters — redirects to `/error?code=bad_callback`

  /api/v1/payments/stripe/webhook:
    post:
      tags: [Payments]
      summary: Stripe webhook
      description: |
        Receives `payment_intent.succeeded` events from Stripe.
        Signature verified via `stripe-signature` header.
        Idempotent — duplicate event IDs have no side effects
        (protected by atomic Redis SET NX on `event.id`).
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema:
            type: string
            description: Stripe webhook signature for payload verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw Stripe Event object
      responses:
        "200":
          description: Event acknowledged (processed or already-seen duplicate)
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [received]
                        properties:
                          received:
                            type: boolean
                            example: true
        "400":
          description: Invalid Stripe signature or malformed payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/uploads:
    post:
      tags: [Uploads]
      summary: Upload gift media
      description: |
        Uploads an image to Cloudinary. Accepts JPEG, PNG, WebP, or GIF up to 5 MB.
        Returns the CDN URL and public ID.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload successful
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [url, publicId]
                        properties:
                          url:
                            type: string
                            format: uri
                          publicId:
                            type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Cloudinary upload failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/uploads/sign:
    post:
      tags: [Uploads]
      summary: Get signed Cloudinary upload params
      description: Returns a signed timestamp and params for a direct client-side Cloudinary upload.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Signed upload parameters
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                type: object
                required: [signature, timestamp, folder, apiKey, cloudName]
                properties:
                  signature:
                    type: string
                  timestamp:
                    type: integer
                  folder:
                    type: string
                  apiKey:
                    type: string
                  cloudName:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/cron/unlock:
    get:
      tags: [Cron]
      summary: Process gift unlocks
      description: |
        Finds all `locked` gifts past their unlock time and transitions them to
        `unlocked`. Uses `SELECT … FOR UPDATE SKIP LOCKED` so concurrent
        scheduler runs are safe and each gift is processed exactly once.
        Requires `Authorization: Bearer <CRON_SECRET>`.
      security:
        - cronBearer: []
      responses:
        "200":
          description: Unlock run complete
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [processed, durationMs]
                        properties:
                          processed:
                            type: integer
                            description: Number of gifts unlocked in this run
                          durationMs:
                            type: integer
                            description: Wall-clock time of the run in milliseconds
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/cron/expire:
    get:
      tags: [Cron]
      summary: Expire stale pending-payment gifts
      description: Marks gifts stuck in `pending_payment` as `expired` after a timeout.
      security:
        - cronBearer: []
      responses:
        "200":
          description: Expiry run complete
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [expired]
                        properties:
                          expired:
                            type: integer
                            description: Number of gifts expired in this run
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/health:
    get:
      tags: [Health]
      summary: Service health check
      description: Returns the health status of the API service and its dependencies.
      responses:
        "200":
          description: Service is healthy
          headers:
            X-API-Version:
              $ref: "#/components/headers/X-API-Version"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "503":
          description: Service is degraded or unhealthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [degraded, error]
                  details:
                    type: object

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: NextAuth.js session cookie obtained after OTP login.
    cronBearer:
      type: http
      scheme: bearer
      description: Static secret set in `CRON_SECRET` environment variable.

  headers:
    X-API-Version:
      description: |
        Current API version number. Clients should assert this matches the version
        they were built against. A change in major version indicates breaking changes.
      schema:
        type: integer
        example: 1

  parameters:
    GiftId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Gift UUID

  schemas:
    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Response payload (shape varies by endpoint — see individual endpoints)

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Human-readable error message suitable for display
          example: "Unauthorized"
        code:
          $ref: "#/components/schemas/ErrorCode"

    ErrorCode:
      type: string
      description: |
        Machine-readable error code for programmatic error handling.
        Clients should switch on this value rather than matching the `error` string.
      enum:
        - BAD_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - VALIDATION_ERROR
        - RATE_LIMITED
        - INTERNAL_ERROR
        - DAILY_LIMIT_EXCEEDED
        - INVALID_TRANSITION
        - GIFT_NOT_UNLOCKED
        - RATE_EXPIRED
        - RATE_SLIPPAGE
      example: UNAUTHORIZED

    Gift:
      type: object
      required:
        - id
        - senderId
        - recipientPhoneHash
        - recipientName
        - amountNgn
        - amountUsdc
        - unlockAt
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        senderId:
          type: string
        recipientPhoneHash:
          type: string
          description: SHA-256 hex digest of the recipient phone — never the plaintext number
        recipientName:
          type: string
        recipientEmail:
          type: string
          format: email
          nullable: true
        amountNgn:
          type: number
          minimum: 100
        amountUsdc:
          type: string
          description: On-chain USDC amount as a string to preserve Stellar precision (7 decimals)
          example: "4.2857143"
        message:
          type: string
          nullable: true
          maxLength: 500
        mediaUrl:
          type: string
          format: uri
          nullable: true
        unlockAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/GiftStatus"
        contractId:
          type: string
          nullable: true
          description: Soroban escrow contract instance ID (C...)
        stellarTxHash:
          type: string
          nullable: true
          description: Stellar transaction hash from the escrow funding call
        claimTxHash:
          type: string
          nullable: true
          description: Stellar transaction hash from the claim call
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GiftStatus:
      type: string
      description: Lifecycle status of a gift
      enum:
        - draft
        - pending_payment
        - funded
        - locked
        - unlocked
        - claimed
        - cancelled
        - expired
      example: locked

    PublicGift:
      type: object
      description: |
        Safe public view of a gift — excludes sender PII and internal fields.
        Returned by the unauthenticated GET /api/v1/gifts/{id} endpoint.
      required:
        - id
        - recipientName
        - amountNgn
        - amountUsdc
        - unlockAt
        - status
      properties:
        id:
          type: string
          format: uuid
        recipientName:
          type: string
        amountNgn:
          type: number
        amountUsdc:
          type: string
        message:
          type: string
          nullable: true
        mediaUrl:
          type: string
          format: uri
          nullable: true
        unlockAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/GiftStatus"

    CreateGiftRequest:
      type: object
      required: [recipientName, recipientPhone, amountNgn, unlockAt]
      properties:
        recipientName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Amaka Obi"
        recipientPhone:
          type: string
          description: E.164 or local Nigerian format — normalised server-side
          example: "+2348012345678"
        recipientEmail:
          type: string
          format: email
          nullable: true
          description: Optional — used to send the recipient an email notification
        amountNgn:
          type: number
          minimum: 100
          example: 5000
        message:
          type: string
          maxLength: 500
          nullable: true
        mediaUrl:
          type: string
          format: uri
          nullable: true
        unlockAt:
          type: string
          format: date-time
          description: ISO 8601 datetime when the gift unlocks (must be in the future)
        paymentProvider:
          type: string
          enum: [paystack, stripe]
          default: paystack

  responses:
    BadRequest:
      description: Invalid request body or parameters
      headers:
        X-API-Version:
          $ref: "#/components/headers/X-API-Version"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "Missing required field: phone"
            code: BAD_REQUEST

    Unauthorized:
      description: Missing or invalid authentication
      headers:
        X-API-Version:
          $ref: "#/components/headers/X-API-Version"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "Unauthorized"
            code: UNAUTHORIZED

    Forbidden:
      description: Authenticated but not authorised for this resource
      headers:
        X-API-Version:
          $ref: "#/components/headers/X-API-Version"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "Forbidden"
            code: FORBIDDEN

    NotFound:
      description: Resource not found
      headers:
        X-API-Version:
          $ref: "#/components/headers/X-API-Version"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "Gift not found"
            code: NOT_FOUND

    Conflict:
      description: Action not allowed in the current resource state
      headers:
        X-API-Version:
          $ref: "#/components/headers/X-API-Version"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "Invalid gift status transition: \"claimed\" → \"locked\""
            code: INVALID_TRANSITION

    UnprocessableEntity:
      description: Request body is syntactically valid but semantically invalid
      headers:
        X-API-Version:
          $ref: "#/components/headers/X-API-Version"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorResponse"
              - type: object
                properties:
                  details:
                    type: array
                    description: Per-field validation errors
                    items:
                      type: object
                      required: [field, message]
                      properties:
                        field:
                          type: string
                          example: amountNgn
                        message:
                          type: string
                          example: "Must be at least 100"
          example:
            success: false
            error: "Validation failed"
            code: VALIDATION_ERROR
            details:
              - field: amountNgn
                message: "Must be at least 100"

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-API-Version:
          $ref: "#/components/headers/X-API-Version"
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit resets
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "Too many requests — try again later"
            code: RATE_LIMITED

    InternalServerError:
      description: Unexpected server error
      headers:
        X-API-Version:
          $ref: "#/components/headers/X-API-Version"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "Internal server error"
            code: INTERNAL_ERROR
