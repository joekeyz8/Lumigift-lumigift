name: Deploy to Production

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  deployments: write

jobs:
  verify-mainnet-environment:
    name: Verify Mainnet Environment
    runs-on: ubuntu-latest
    environment: production
    outputs:
      network-ok: ${{ steps.gate.outputs.network-ok }}
    steps:
      - name: Verify deployment environment
        id: gate
        env:
          STELLAR_NETWORK: ${{ vars.STELLAR_NETWORK }}
          CONTRACT_ID: ${{ secrets.STELLAR_ESCROW_CONTRACT_ID }}
          SERVER_SECRET: ${{ secrets.STELLAR_SERVER_SECRET_KEY }}
        run: |
          echo "=== Mainnet Deployment Safety Gate ==="
          echo "Triggered by: $GITHUB_ACTOR"
          echo "Ref:          $GITHUB_REF"
          echo "SHA:          $GITHUB_SHA"
          echo ""

          FAIL=0

          # Gate 1: STELLAR_NETWORK must be 'mainnet'
          if [ "${STELLAR_NETWORK}" != "mainnet" ]; then
            echo "❌ STELLAR_NETWORK is '${STELLAR_NETWORK}', expected 'mainnet'"
            echo "   Set STELLAR_NETWORK=mainnet in the 'production' GitHub environment variables."
            FAIL=1
          else
            echo "✅ STELLAR_NETWORK=mainnet"
          fi

          # Gate 2: Contract ID must be set and non-empty
          if [ -z "${CONTRACT_ID}" ]; then
            echo "❌ STELLAR_ESCROW_CONTRACT_ID secret is not set or empty."
            FAIL=1
          else
            echo "✅ STELLAR_ESCROW_CONTRACT_ID is set (${#CONTRACT_ID} chars)"
          fi

          # Gate 3: Signer key must be set and non-empty
          if [ -z "${SERVER_SECRET}" ]; then
            echo "❌ STELLAR_SERVER_SECRET_KEY secret is not set or empty."
            FAIL=1
          else
            echo "✅ STELLAR_SERVER_SECRET_KEY is set (${#SERVER_SECRET} chars)"
          fi

          # Gate 4: Signer key must look like a Stellar secret key (S + 55 base32 chars)
          if [[ ! "${SERVER_SECRET}" =~ ^S[A-Z2-7]{55}$ ]]; then
            echo "❌ STELLAR_SERVER_SECRET_KEY does not match Stellar secret key format (S + 55 base32)."
            FAIL=1
          else
            echo "✅ STELLAR_SERVER_SECRET_KEY format valid"
          fi

          echo ""
          if [ "$FAIL" -eq 1 ]; then
            echo "🚫 Deployment blocked — fix the issues above before retrying."
            echo "network-ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "✅ All mainnet safety gates passed. Proceeding with deployment."
          echo "network-ok=true" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [verify-mainnet-environment]
    if: needs.verify-mainnet-environment.outputs.network-ok == 'true'
    environment: production
    outputs:
      deployment-url: ${{ steps.deploy.outputs.preview-url }}
      previous-deployment-url: ${{ steps.record-previous.outputs.previous-url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Deployment dry-run summary
        run: |
          echo "=== Deployment Summary ==="
          echo "Branch:      $GITHUB_REF_NAME"
          echo "Commit:      $GITHUB_SHA"
          echo "Actor:       $GITHUB_ACTOR"
          echo "Network:     mainnet"
          echo "Deploying:   Next.js app to Vercel production"
          echo "================================="

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_NAME: Lumigift
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STELLAR_NETWORK: mainnet
          STELLAR_HORIZON_URL: https://horizon.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
          STELLAR_ESCROW_CONTRACT_ID: ${{ secrets.STELLAR_ESCROW_CONTRACT_ID }}
          STELLAR_SERVER_SECRET_KEY: ${{ secrets.STELLAR_SERVER_SECRET_KEY }}
          USDC_ISSUER: ${{ vars.USDC_ISSUER }}
          USDC_ASSET_CODE: USDC
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload source maps to Sentry
        run: npx @sentry/cli@2 releases files "${{ github.sha }}" upload-sourcemaps .next --url-prefix "~/_next" --rewrite
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@9f74b3dd5db549fd4b35b62e18ce9c965cdfa1c3 # v2.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"

  # ── Issue #100: Smoke tests + rollback gate ──────────────────────────────────
  smoke-tests:
    name: Smoke Tests (production)
    runs-on: ubuntu-latest
    needs: [deploy]
    environment: production
    outputs:
      smoke-passed: ${{ steps.run-smoke.outputs.smoke-passed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Wait for deployment to be live
        # Give Vercel's CDN a moment to propagate before probing
        run: sleep 15

      - name: Run smoke tests
        id: run-smoke
        env:
          BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          chmod +x scripts/smoke-test.sh
          if bash scripts/smoke-test.sh; then
            echo "smoke-passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "smoke-passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload smoke test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-failure-${{ github.sha }}
          path: /tmp/smoke_body.txt
          retention-days: 7

  # ── Issue #100: Rollback gate — triggers if smoke tests fail ─────────────────
  rollback-gate:
    name: Rollback Gate
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    environment: production
    if: failure() && needs.smoke-tests.outputs.smoke-passed == 'false'
    steps:
      - name: Notify rollback required
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "🚨 Smoke tests FAILED for commit $GITHUB_SHA"
          echo "Rollback to the previous production deployment is required."
          echo ""
          echo "To roll back manually:"
          echo "  1. Go to https://vercel.com/dashboard"
          echo "  2. Navigate to the Lumigift project → Deployments"
          echo "  3. Find the last successful production deployment"
          echo "  4. Click '...' → 'Promote to Production'"
          echo ""
          echo "Or via Vercel CLI:"
          echo "  vercel rollback --token \$VERCEL_TOKEN"

          # Post to Slack if webhook is configured
          if [ -n "${SLACK_WEBHOOK}" ]; then
            curl -s -X POST "${SLACK_WEBHOOK}" \
              -H "Content-Type: application/json" \
              -d "{
                \"text\": \"🚨 *Production smoke tests FAILED* — rollback required\",
                \"attachments\": [{
                  \"color\": \"danger\",
                  \"fields\": [
                    {\"title\": \"Commit\", \"value\": \"$GITHUB_SHA\", \"short\": true},
                    {\"title\": \"Actor\", \"value\": \"$GITHUB_ACTOR\", \"short\": true},
                    {\"title\": \"Action\", \"value\": \"<https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID|View Run>\", \"short\": false}
                  ]
                }]
              }"
          fi

      - name: Attempt automatic rollback via Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Attempting automatic rollback..."
          # Install Vercel CLI
          npm install -g vercel@latest --silent

          # Roll back to the last known-good production deployment
          # vercel rollback promotes the second-most-recent production deployment
          if vercel rollback \
              --token "${VERCEL_TOKEN}" \
              --scope "${VERCEL_ORG_ID}" \
              --yes \
              2>&1; then
            echo "✅ Automatic rollback succeeded."
          else
            echo "⚠️  Automatic rollback failed — manual intervention required."
            echo "    See instructions above for manual rollback steps."
            # Exit non-zero so the job is marked failed and engineers are notified
            exit 1
          fi
