name: Deploy to Production

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    # Weekly fuzz run (issue #532) — Sundays at 02:00 UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      run_fuzz:
        description: "Run the 24h escrow fuzz job"
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write
  id-token: write          # required for Cosign keyless verification (OIDC)

jobs:
  verify-mainnet-environment:
    name: Verify Mainnet Environment
    runs-on: ubuntu-latest
    environment: production
    outputs:
      network-ok: ${{ steps.gate.outputs.network-ok }}
    steps:
      - name: Verify deployment environment
        id: gate
        env:
          STELLAR_NETWORK: ${{ vars.STELLAR_NETWORK }}
          CONTRACT_ID: ${{ secrets.STELLAR_ESCROW_CONTRACT_ID }}
          SERVER_SECRET: ${{ secrets.STELLAR_SERVER_SECRET_KEY }}
        run: |
          echo "=== Mainnet Deployment Safety Gate ==="
          echo "Triggered by: $GITHUB_ACTOR"
          echo "Ref:          $GITHUB_REF"
          echo "SHA:          $GITHUB_SHA"
          echo ""

          FAIL=0

          # Gate 1: STELLAR_NETWORK must be 'mainnet'
          if [ "${STELLAR_NETWORK}" != "mainnet" ]; then
            echo "❌ STELLAR_NETWORK is '${STELLAR_NETWORK}', expected 'mainnet'"
            echo "   Set STELLAR_NETWORK=mainnet in the 'production' GitHub environment variables."
            FAIL=1
          else
            echo "✅ STELLAR_NETWORK=mainnet"
          fi

          # Gate 2: Contract ID must be set and non-empty
          if [ -z "${CONTRACT_ID}" ]; then
            echo "❌ STELLAR_ESCROW_CONTRACT_ID secret is not set or empty."
            FAIL=1
          else
            echo "✅ STELLAR_ESCROW_CONTRACT_ID is set (${#CONTRACT_ID} chars)"
          fi

          # Gate 3: Signer key must be set and non-empty
          if [ -z "${SERVER_SECRET}" ]; then
            echo "❌ STELLAR_SERVER_SECRET_KEY secret is not set or empty."
            FAIL=1
          else
            echo "✅ STELLAR_SERVER_SECRET_KEY is set (${#SERVER_SECRET} chars)"
          fi

          # Gate 4: Signer key must look like a Stellar secret key (S + 55 base32 chars)
          if [[ ! "${SERVER_SECRET}" =~ ^S[A-Z2-7]{55}$ ]]; then
            echo "❌ STELLAR_SERVER_SECRET_KEY does not match Stellar secret key format (S + 55 base32)."
            FAIL=1
          else
            echo "✅ STELLAR_SERVER_SECRET_KEY format valid"
          fi

          echo ""
          if [ "$FAIL" -eq 1 ]; then
            echo "🚫 Deployment blocked — fix the issues above before retrying."
            echo "network-ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "✅ All mainnet safety gates passed. Proceeding with deployment."
          echo "network-ok=true" >> "$GITHUB_OUTPUT"

  # ── Issue #530: Escrow contract deployment to Stellar mainnet (Gate C-3) ────
  deploy-contract-mainnet:
    name: Deploy Escrow Contract (mainnet)
    runs-on: ubuntu-latest
    needs: [verify-mainnet-environment]
    if: needs.verify-mainnet-environment.outputs.network-ok == 'true'
    environment: production
    outputs:
      contract-id: ${{ steps.deploy-contract.outputs.contract-id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Needed to commit the updated .contract-ids.json back to main
          persist-credentials: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ── Fetch the mainnet admin key from the secrets manager ────────────────
      # The admin key is NOT stored in an env file or repo secrets directly;
      # it lives in the secrets manager and is fetched at deploy time using
      # short-lived OIDC credentials (id-token: write at workflow level).
      - name: Fetch mainnet admin key from secrets manager
        id: fetch-admin-key
        env:
          SECRETS_MANAGER_URL: ${{ vars.SECRETS_MANAGER_URL }}
          SECRETS_MANAGER_TOKEN: ${{ secrets.SECRETS_MANAGER_TOKEN }}
          ADMIN_KEY_PATH: ${{ vars.MAINNET_ADMIN_KEY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${SECRETS_MANAGER_URL}" ] || [ -z "${SECRETS_MANAGER_TOKEN}" ]; then
            echo "❌ Secrets manager URL/token not configured."
            exit 1
          fi
          ADMIN_KEY="$(curl -fsS \
            -H "Authorization: Bearer ${SECRETS_MANAGER_TOKEN}" \
            "${SECRETS_MANAGER_URL}/v1/secrets/${ADMIN_KEY_PATH}" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);process.stdout.write(j.value||"")})')"
          if [[ ! "${ADMIN_KEY}" =~ ^S[A-Z2-7]{55}$ ]]; then
            echo "❌ Admin key from secrets manager is not a valid Stellar secret key."
            exit 1
          fi
          echo "✅ Admin key retrieved from secrets manager"
          # Mask and export for subsequent steps only (never written to disk)
          echo "::add-mask::${ADMIN_KEY}"
          echo "admin-key=${ADMIN_KEY}" >> "$GITHUB_OUTPUT"

      - name: Deploy escrow contract to mainnet
        id: deploy-contract
        env:
          STELLAR_NETWORK: mainnet
          STELLAR_HORIZON_URL: https://horizon.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
          STELLAR_ADMIN_SECRET_KEY: ${{ steps.fetch-admin-key.outputs.admin-key }}
        run: |
          set -euo pipefail
          npx ts-node scripts/deploy-contract.ts --network mainnet
          CONTRACT_ID="$(node -e 'const j=require("./.contract-ids.json");process.stdout.write(j.mainnet||"")')"
          if [ -z "${CONTRACT_ID}" ]; then
            echo "❌ .contract-ids.json has no mainnet contract ID after deploy."
            exit 1
          fi
          echo "✅ Deployed mainnet contract: ${CONTRACT_ID}"
          echo "contract-id=${CONTRACT_ID}" >> "$GITHUB_OUTPUT"

      - name: Commit updated .contract-ids.json
        run: |
          set -euo pipefail
          if git diff --quiet -- .contract-ids.json; then
            echo "No changes to .contract-ids.json — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .contract-ids.json
          git commit -m "chore(contracts): record mainnet escrow contract ID [skip ci]"
          git push

      - name: Run contract smoke test against mainnet
        env:
          STELLAR_NETWORK: mainnet
          STELLAR_HORIZON_URL: https://horizon.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
          STELLAR_ESCROW_CONTRACT_ID: ${{ steps.deploy-contract.outputs.contract-id }}
        run: npm run contract:smoke

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [verify-mainnet-environment, deploy-contract-mainnet]
    if: needs.verify-mainnet-environment.outputs.network-ok == 'true'
    environment: production
    outputs:
      deployment-url: ${{ steps.deploy.outputs.preview-url }}
      previous-deployment-url: ${{ steps.record-previous.outputs.previous-url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Deployment dry-run summary
        run: |
          echo "=== Deployment Summary ==="
          echo "Branch:      $GITHUB_REF_NAME"
          echo "Commit:      $GITHUB_SHA"
          echo "Actor:       $GITHUB_ACTOR"
          echo "Network:     mainnet"
          echo "Deploying:   Next.js app to Vercel production"
          echo "================================="

      # ── Verify the Docker image was signed by cosign-sign.yml ───────────────
      # This ensures the exact image built and signed in CI is what gets deployed.
      # The Cosign keyless signature was created with GitHub OIDC identity tied
      # to the cosign-sign.yml workflow, so impersonation is not possible.
      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Log in to GHCR (for image verification)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image signature before deploy
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          echo "Verifying Cosign signature on: ${IMAGE_REF}"

          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/cosign-sign.yml" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE_REF}"

          echo "✅ Image signature verified — proceeding with deployment"

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_NAME: Lumigift
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STELLAR_NETWORK: mainnet
          STELLAR_HORIZON_URL: https://horizon.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Public Global Stellar Network ; September 2015"
          STELLAR_ESCROW_CONTRACT_ID: ${{ secrets.STELLAR_ESCROW_CONTRACT_ID }}
          STELLAR_SERVER_SECRET_KEY: ${{ secrets.STELLAR_SERVER_SECRET_KEY }}
          USDC_ISSUER: ${{ vars.USDC_ISSUER }}
          USDC_ASSET_CODE: USDC
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload source maps to Sentry
        run: npx @sentry/cli@2 releases files "${{ github.sha }}" upload-sourcemaps .next --url-prefix "~/_next" --rewrite
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@9f74b3dd5db549fd4b35b62e18ce9c965cdfa1c3 # v2.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"

  # ── Issue #100: Smoke tests + rollback gate ──────────────────────────────────
  smoke-tests:
    name: Smoke Tests (production)
    runs-on: ubuntu-latest
    needs: [deploy]
    environment: production
    outputs:
      smoke-passed: ${{ steps.run-smoke.outputs.smoke-passed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Wait for deployment to be live
        # Give Vercel's CDN a moment to propagate before probing
        run: sleep 15

      - name: Run smoke tests
        id: run-smoke
        env:
          BASE_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          chmod +x scripts/smoke-test.sh
          if bash scripts/smoke-test.sh; then
            echo "smoke-passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "smoke-passed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload smoke test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-test-failure-${{ github.sha }}
          path: /tmp/smoke_body.txt
          retention-days: 7

  # ── Issue #100: Rollback gate — triggers if smoke tests fail ─────────────────
  rollback-gate:
    name: Rollback Gate
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    environment: production
    if: failure() && needs.smoke-tests.outputs.smoke-passed == 'false'
    steps:
      - name: Notify rollback required
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "🚨 Smoke tests FAILED for commit $GITHUB_SHA"
          echo "Rollback to the previous production deployment is required."
          echo ""
          echo "To roll back manually:"
          echo "  1. Go to https://vercel.com/dashboard"
          echo "  2. Navigate to the Lumigift project → Deployments"
          echo "  3. Find the last successful production deployment"
          echo "  4. Click '...' → 'Promote to Production'"
          echo ""
          echo "Or via Vercel CLI:"
          echo "  vercel rollback --token \$VERCEL_TOKEN"

          # Post to Slack if webhook is configured
          if [ -n "${SLACK_WEBHOOK}" ]; then
            curl -s -X POST "${SLACK_WEBHOOK}" \
              -H "Content-Type: application/json" \
              -d "{
                \"text\": \"🚨 *Production smoke tests FAILED* — rollback required\",
                \"attachments\": [{
                  \"color\": \"danger\",
                  \"fields\": [
                    {\"title\": \"Commit\", \"value\": \"$GITHUB_SHA\", \"short\": true},
                    {\"title\": \"Actor\", \"value\": \"$GITHUB_ACTOR\", \"short\": true},
                    {\"title\": \"Action\", \"value\": \"<https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID|View Run>\", \"short\": false}
                  ]
                }]
              }"
          fi

      - name: Attempt automatic rollback via Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Attempting automatic rollback..."
          # Install Vercel CLI
          npm install -g vercel@latest --silent

          # Roll back to the last known-good production deployment
          # vercel rollback promotes the second-most-recent production deployment
          if vercel rollback \
              --token "${VERCEL_TOKEN}" \
              --scope "${VERCEL_ORG_ID}" \
              --yes \
              2>&1; then
            echo "✅ Automatic rollback succeeded."
          else
            echo "⚠️  Automatic rollback failed — manual intervention required."
            echo "    See instructions above for manual rollback steps."
            # Exit non-zero so the job is marked failed and engineers are notified
            exit 1
          fi

  # ── Issue #532: Escrow contract fuzz testing (weekly, 24h) ──────────────────
  fuzz-escrow:
    name: Fuzz Escrow Contract (24h)
    runs-on: ubuntu-latest
    # Runs on the weekly schedule or when manually requested
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_fuzz)
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz target for 24h
        working-directory: contracts/escrow
        run: |
          set -euo pipefail
          # 24h = 86400s; cargo-fuzz accepts a duration via -max_total_time
          cargo +nightly fuzz run escrow_state_transitions -- -max_total_time=86400

      - name: Upload fuzz artifacts (crashes, corpus)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: escrow-fuzz-artifacts-${{ github.run_id }}
          path: |
            contracts/escrow/fuzz/artifacts/
            contracts/escrow/fuzz/corpus/
          retention-days: 30

  # ── Issue #533: E2E upgrade test on testnet ─────────────────────────────────
  upgrade-e2e-testnet:
    name: E2E Upgrade Test (testnet)
    runs-on: ubuntu-latest
    needs: [deploy-contract-mainnet]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Rust toolchain + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Deploy escrow contract to testnet
        env:
          STELLAR_NETWORK: testnet
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          STELLAR_ADMIN_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_ADMIN_SECRET_KEY }}
        run: npx ts-node scripts/deploy-contract.ts --network testnet

      - name: Upgrade contract and assert Upgraded event
        env:
          STELLAR_NETWORK: testnet
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          STELLAR_ADMIN_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_ADMIN_SECRET_KEY }}
        run: npm run contract:upgrade:e2e
