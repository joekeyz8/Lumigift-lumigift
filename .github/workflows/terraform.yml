name: Terraform Plan

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      # Secrets Manager rotation Lambda + 90-day schedule (issue #556)
      - "infra/terraform/secrets_rotation.tf"
      - "infra/terraform/lambda/**"
      # Cross-region RDS read replica (issue #560)
      - "infra/terraform/rds_replica.tf"
      - "infra/terraform/replica/**"

# OIDC — no long-lived AWS credentials stored in GitHub Secrets.
# The id-token: write permission lets GitHub mint a short-lived OIDC token.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@651471c36a6092792c552e8b1bef71e592b462d8 # v4
        with:
          terraform_version: "1.6"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Init (replica region)
        # Cross-region RDS read replica (issue #560) lives in a second provider alias.
        run: terraform init -input=false -reconfigure
        env:
          TF_VAR_replica_region: ${{ secrets.TF_VAR_REPLICA_REGION }}

      - name: Terraform Validate
        run: terraform validate

      - name: Scan Terraform for Security Misconfigurations (Trivy)
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.29.0
        with:
          scan-type: "config"
          scan-ref: "infra/terraform"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: "table"

      - name: Terraform Plan
        id: plan
        run: terraform plan -input=false -no-color
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_tf_state_kms_key_id: ${{ secrets.TF_VAR_TF_STATE_KMS_KEY_ID }}
          TF_VAR_vpc_id: ${{ secrets.TF_VAR_VPC_ID }}
          TF_VAR_private_subnet_ids: ${{ secrets.TF_VAR_PRIVATE_SUBNET_IDS }}
          TF_VAR_app_image: ${{ secrets.TF_VAR_APP_IMAGE }}
          TF_VAR_domain_name: ${{ secrets.TF_VAR_DOMAIN_NAME }}
          # Secrets Manager rotation Lambda + 90-day schedule (issue #556)
          TF_VAR_db_rotation_lambda_zip: ${{ secrets.TF_VAR_DB_ROTATION_LAMBDA_ZIP }}
          TF_VAR_db_rotation_schedule_days: "90"
          # Cross-region RDS read replica (issue #560)
          TF_VAR_replica_region: ${{ secrets.TF_VAR_REPLICA_REGION }}
          TF_VAR_replica_instance_class: ${{ secrets.TF_VAR_REPLICA_INSTANCE_CLASS }}
        continue-on-error: true

      - name: Post plan to PR
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const output = `#### Terraform Plan 📖\n\`\`\`\n${{ steps.plan.outputs.stdout }}\n\`\`\`\n*Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: Terraform Apply (rotation + replica)
    # Plan/apply gate for the new infrastructure (issues #556, #560).
    # Applies only after the plan job succeeds and only on the main branch.
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@651471c36a6092792c552e8b1bef71e592b462d8 # v4
        with:
          terraform_version: "1.6"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve -no-color
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
          TF_VAR_tf_state_kms_key_id: ${{ secrets.TF_VAR_TF_STATE_KMS_KEY_ID }}
          TF_VAR_vpc_id: ${{ secrets.TF_VAR_VPC_ID }}
          TF_VAR_private_subnet_ids: ${{ secrets.TF_VAR_PRIVATE_SUBNET_IDS }}
          TF_VAR_app_image: ${{ secrets.TF_VAR_APP_IMAGE }}
          TF_VAR_domain_name: ${{ secrets.TF_VAR_DOMAIN_NAME }}
          # Secrets Manager rotation Lambda + 90-day schedule (issue #556)
          TF_VAR_db_rotation_lambda_zip: ${{ secrets.TF_VAR_DB_ROTATION_LAMBDA_ZIP }}
          TF_VAR_db_rotation_schedule_days: "90"
          # Cross-region RDS read replica (issue #560)
          TF_VAR_replica_region: ${{ secrets.TF_VAR_REPLICA_REGION }}
          TF_VAR_replica_instance_class: ${{ secrets.TF_VAR_REPLICA_INSTANCE_CLASS }}
