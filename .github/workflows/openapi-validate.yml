name: OpenAPI Validation

# ────────────────────────────────────────────────────────────────────────────
# Issue #116: Automate OpenAPI validation and publish versioned references.
#
# Acceptance criteria:
#   ✅  CI detects undocumented route changes
#   ✅  Deprecations are identified and reported
#   ✅  openapi.yaml is always kept in sync with public/openapi.yaml
# ────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    paths:
      - "openapi.yaml"
      - "public/openapi.yaml"
      - "src/app/api/**"
  push:
    branches: [main, develop]
    paths:
      - "openapi.yaml"
      - "public/openapi.yaml"
      - "src/app/api/**"

jobs:
  # ─── 1. Lint & validate the OpenAPI spec ─────────────────────────────────
  validate-openapi:
    name: Validate OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Lint openapi.yaml with Redocly
        run: |
          npx --yes @redocly/cli@1.34.1 lint openapi.yaml \
            --format=stylish \
            --extends=recommended

      - name: Lint public/openapi.yaml
        run: |
          npx --yes @redocly/cli@1.34.1 lint public/openapi.yaml \
            --format=stylish \
            --extends=recommended

      - name: Check openapi.yaml and public/openapi.yaml are in sync
        run: |
          if ! diff -q openapi.yaml public/openapi.yaml > /dev/null 2>&1; then
            echo "❌ openapi.yaml and public/openapi.yaml are out of sync."
            echo ""
            echo "Run: cp openapi.yaml public/openapi.yaml"
            echo ""
            diff openapi.yaml public/openapi.yaml || true
            exit 1
          fi
          echo "✅ openapi.yaml and public/openapi.yaml are in sync."

  # ─── 2. Detect deprecated operations ─────────────────────────────────────
  detect-deprecations:
    name: Detect Deprecated Operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Report deprecated operations
        # Exits with code 0 but prints a warning so the PR author is aware.
        # Change `exit 0` → `exit 1` to make the job fail on any deprecation.
        run: |
          node - << 'EOF'
          const fs = require("fs");
          const yaml = require("js-yaml");

          let spec;
          try {
            spec = yaml.load(fs.readFileSync("openapi.yaml", "utf8"));
          } catch (err) {
            console.error("Failed to parse openapi.yaml:", err.message);
            process.exit(1);
          }

          const deprecated = [];

          for (const [path, methods] of Object.entries(spec.paths ?? {})) {
            for (const [method, op] of Object.entries(methods ?? {})) {
              if (typeof op === "object" && op !== null && op.deprecated === true) {
                deprecated.push({ path, method: method.toUpperCase(), summary: op.summary ?? "" });
              }
            }
          }

          if (deprecated.length === 0) {
            console.log("✅ No deprecated operations found in openapi.yaml.");
            process.exit(0);
          }

          console.warn("⚠️  Deprecated operations detected:");
          for (const { path, method, summary } of deprecated) {
            console.warn(`   ${method} ${path}  — ${summary || "(no summary)"}`);
          }
          console.warn("");
          console.warn(
            `${deprecated.length} deprecated operation(s) should be removed or migrated before the next major release.`
          );
          // Non-blocking warning — does not fail the workflow
          process.exit(0);
          EOF
        # js-yaml is a transitive dependency already available via npx
        env:
          NODE_PATH: node_modules

      - name: Install js-yaml for deprecation scanner
        run: npm install --no-save js-yaml

      - name: Scan for deprecated operations
        run: |
          node scripts/scan-deprecated-openapi.js 2>&1 || true

  # ─── 3. Detect undocumented route changes ────────────────────────────────
  detect-undocumented-routes:
    name: Detect Undocumented Route Changes
    runs-on: ubuntu-latest
    # Only run on PRs so we have a base to compare against
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0   # full history needed for diff

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Check for new route files not reflected in openapi.yaml
        id: route-check
        run: |
          set +e

          # Collect all route.ts files added or modified in this PR
          CHANGED_ROUTES=$(git diff --name-only --diff-filter=AM \
            "origin/${{ github.base_ref }}" HEAD \
            -- 'src/app/api/**' \
            | grep 'route\.ts$' || true)

          if [ -z "$CHANGED_ROUTES" ]; then
            echo "✅ No API route files changed in this PR."
            exit 0
          fi

          echo "Changed route files:"
          echo "$CHANGED_ROUTES"
          echo ""

          # Extract documented paths from openapi.yaml
          DOCUMENTED_PATHS=$(node -e "
            const fs = require('fs');
            const yaml = require('js-yaml');
            const spec = yaml.load(fs.readFileSync('openapi.yaml', 'utf8'));
            Object.keys(spec.paths ?? {}).forEach(p => console.log(p));
          " 2>/dev/null || echo "")

          UNDOCUMENTED=0
          while IFS= read -r route_file; do
            # Convert file path to expected API path
            # e.g. src/app/api/v1/gifts/route.ts  → /api/v1/gifts
            #      src/app/api/v1/gifts/[id]/route.ts → /api/v1/gifts/{id}
            API_PATH=$(echo "$route_file" \
              | sed 's|src/app||' \
              | sed 's|/route\.ts$||' \
              | sed 's|\[id\]|{id}|g' \
              | sed 's|\[\.\.\.[^]]*\]|{slug}|g')

            if echo "$DOCUMENTED_PATHS" | grep -qF "$API_PATH"; then
              echo "✅ Documented: $API_PATH  (from $route_file)"
            else
              echo "⚠️  UNDOCUMENTED: $API_PATH  (from $route_file)"
              UNDOCUMENTED=$((UNDOCUMENTED + 1))
            fi
          done <<< "$CHANGED_ROUTES"

          if [ "$UNDOCUMENTED" -gt 0 ]; then
            echo ""
            echo "⚠️  $UNDOCUMENTED route change(s) have no matching entry in openapi.yaml."
            echo ""
            echo "Please update openapi.yaml (and public/openapi.yaml) to document the new"
            echo "or changed route(s) before merging this PR."
            # Non-blocking for now — change exit 0 → exit 1 to enforce strictly.
            exit 0
          fi

          echo "✅ All changed routes are documented in openapi.yaml."
        env:
          NODE_PATH: node_modules

      - name: Install js-yaml for route checker
        run: npm install --no-save js-yaml

  # ─── 4. Publish API reference (on push to main) ───────────────────────────
  publish-api-reference:
    name: Publish API Reference
    runs-on: ubuntu-latest
    needs: [validate-openapi]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Build HTML reference with Redocly
        run: |
          npx --yes @redocly/cli@1.34.1 build-docs openapi.yaml \
            --output=docs/api-reference.html \
            --title="Lumigift API Reference"

      - name: Upload API reference as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-reference-${{ github.sha }}
          path: docs/api-reference.html
          retention-days: 90
