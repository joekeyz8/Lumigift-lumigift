name: Deploy to Staging

on:
  push:
    branches: [develop]

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  # ── Issue #294: Run parity check before deploying ───────────────────────────
  parity-check:
    name: Staging Parity Check
    uses: ./.github/workflows/staging-parity.yml

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    needs: parity-check
    outputs:
      staging-url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.STAGING_APP_URL }}
          NEXT_PUBLIC_APP_NAME: Lumigift (Staging)
          NEXTAUTH_URL: ${{ vars.STAGING_APP_URL }}
          NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STELLAR_NETWORK: testnet
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          STELLAR_ESCROW_CONTRACT_ID: ${{ secrets.STAGING_STELLAR_ESCROW_CONTRACT_ID }}
          STELLAR_SERVER_SECRET_KEY: ${{ secrets.STAGING_STELLAR_SERVER_SECRET_KEY }}
          USDC_ISSUER: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
          USDC_ASSET_CODE: USDC
          PAYSTACK_SECRET_KEY: ${{ secrets.STAGING_PAYSTACK_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
          TERMII_API_KEY: ${{ secrets.STAGING_TERMII_API_KEY }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}

      - name: Deploy to Vercel (staging)
        id: deploy
        uses: amondnet/vercel-action@9f74b3dd5db549fd4b35b62e18ce9c965cdfa1c3 # v2.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # No --prod flag → creates a preview deployment (staging)
          alias-domains: staging.lumigift.app

  smoke-tests:
    name: Smoke Tests (staging)
    runs-on: ubuntu-latest
    needs: deploy-staging
    env:
      STAGING_URL: ${{ needs.deploy-staging.outputs.staging-url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against staging
        run: npm run e2e -- --grep "@smoke"
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.STAGING_URL }}
          CI: true

      - name: Upload smoke test report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-smoke-report
          path: playwright-report/
          retention-days: 7

  # ── Issue #561: Load tests gate production deploys ──────────────────────────
  load-tests:
    name: Load Tests (staging)
    runs-on: ubuntu-latest
    needs: [deploy-staging, smoke-tests]
    env:
      STAGING_URL: ${{ needs.deploy-staging.outputs.staging-url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run load tests against staging
        run: |
          mkdir -p load-test-results
          k6 run \
            --vus 50 \
            --duration 2m \
            --summary-export load-test-results/summary.json \
            --out json=load-test-results/results.json \
            load-tests/scenarios.js
        env:
          BASE_URL: ${{ env.STAGING_URL }}
          AUTH_TOKEN: ${{ secrets.STAGING_LOAD_TEST_AUTH_TOKEN }}
          GIFT_IDS: ${{ vars.STAGING_LOAD_TEST_GIFT_IDS }}
          STELLAR_KEY: ${{ secrets.STAGING_STELLAR_SERVER_SECRET_KEY }}

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-load-test-results
          path: load-test-results/
          retention-days: 14
