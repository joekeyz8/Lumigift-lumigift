name: Docker Security & SBOM

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
    paths:
      - "Dockerfile*"
      - ".dockerignore"
      - "docker-compose*.yml"
      - "package*.json"
      - "next.config.mjs"
      - "src/**"
      - "public/**"
      - "migrations/**"
      - ".github/workflows/docker-security.yml"
  schedule:
    - cron: "0 6 * * 1" # Weekly scan every Monday at 06:00 UTC

concurrency:
  group: docker-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  dockerfile-lint:
    name: Hadolint (Dockerfile Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint Production Dockerfile
        uses: hadolint/hadolint-action@54c9daabfe82e31417d0273e62c3040342469982 # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Lint Development Dockerfile
        uses: hadolint/hadolint-action@54c9daabfe82e31417d0273e62c3040342469982 # v3.1.0
        with:
          dockerfile: Dockerfile.dev
          failure-threshold: warning

  build-scan-and-sbom:
    name: Build, Scan & Publish SBOM
    runs-on: ubuntu-latest
    needs: [dockerfile-lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Hardened Production Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          target: runner
          load: true
          tags: |
            lumigift-app:latest
            lumigift-app:${{ github.sha }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.29.0
        with:
          image-ref: "lumigift-app:latest"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Run Trivy SARIF Report Generation
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.29.0
        with:
          image-ref: "lumigift-app:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Trivy Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@b56ba49b26e50535fa1e7f7db0f4f7b4bf65d80d # v3.28.10
        if: always()
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-docker"

      - name: Verify Non-Root & CIS Docker Best Practices (Dockle)
        uses: erzz/dockle-action@b0445d064dd0ecb06259063c87e02cf3c959725f # v1.4.0
        with:
          image: "lumigift-app:latest"
          exit-code: "0"
          failure-threshold: "fatal"

      - name: Generate SPDX & CycloneDX SBOM (Syft)
        uses: anchore/sbom-action@fc46e511472816045887463f0449495b4e05bd5a # v0.17.9
        with:
          image: "lumigift-app:latest"
          format: "spdx-json"
          output-file: "lumigift-sbom.spdx.json"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@fc46e511472816045887463f0449495b4e05bd5a # v0.17.9
        with:
          image: "lumigift-app:latest"
          format: "cyclonedx-json"
          output-file: "lumigift-sbom.cdx.json"

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumigift-production-sbom
          path: |
            lumigift-sbom.spdx.json
            lumigift-sbom.cdx.json
            trivy-results.sarif
          retention-days: 30
