name: Cron Integration Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  cron-integration-tests:
    name: Cron Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      CRON_SECRET: test_cron_secret_for_ci
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U test_user -d test_db; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      - name: Run database migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Seed test database
        run: npm run db:seed:test
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Run cron integration tests
        run: npx jest --config jest.config.js --runInBand --testPathPattern "cron.*integration" --forceExit
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          CRON_SECRET: ${{ env.CRON_SECRET }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cron-integration-test-results
          path: |
            coverage/
            junit.xml
          if-no-files-found: ignore
          retention-days: 7