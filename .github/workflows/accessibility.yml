name: Accessibility Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── jest-axe: component-level audits ────────────────────────────────────────
  axe-audit:
    name: axe-core Accessibility Audit (jest-axe)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Run all jest-axe accessibility tests
        # Dedicated accessibility gate — runs every jest-axe suite on every PR.
        # Covers landing, /send, /dashboard, /auth/login, /auth/register, /profile,
        # /claim, gift detail, /help, /notifications and shared components.
        # Exit code is non-zero if any critical/serious violation is found.
        # Exceptions are tracked in docs/accessibility/known-violations.md.
        run: |
          ./node_modules/.bin/jest \
            src/app/__tests__/accessibility.test.tsx \
            src/app/__tests__/accessibility-routes.test.tsx \
            src/app/__tests__/accessibility-all-routes.test.tsx \
            --no-coverage --json --outputFile=axe-results.json

      - name: Upload axe results artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axe-audit-results
          path: axe-results.json
          retention-days: 30

  # ── @axe-core/playwright: full-page E2E audits ───────────────────────────────
  axe-e2e:
    name: axe-core Accessibility Audit (Playwright E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Build app for Playwright
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_APP_NAME: Lumigift
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-test-secret-not-real
          DATABASE_URL: postgresql://lumigift:lumigift@localhost:5432/lumigift_test
          STELLAR_NETWORK: testnet
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          STELLAR_ESCROW_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD2KM
          STELLAR_SERVER_SECRET_KEY: SAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_SERVER_PUBLIC_KEY: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          USDC_ISSUER: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
          USDC_ASSET_CODE: USDC
          PAYSTACK_SECRET_KEY: sk_test_placeholder
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          TERMII_API_KEY: placeholder
          REDIS_URL: redis://localhost:6379
          CRON_SECRET: ci-cron-secret
          CSRF_SECRET: ci-csrf-secret
          CLOUDINARY_CLOUD_NAME: placeholder
          CLOUDINARY_API_KEY: "000000000000000"
          CLOUDINARY_API_SECRET: placeholder

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run axe-core E2E accessibility audit
        # Issue #293 — runs @axe-core/playwright against all routes
        run: npx playwright test e2e/accessibility-axe.spec.ts --project=chromium --reporter=html
        env:
          CI: "true"

      - name: Upload Playwright axe report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axe-playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Post results as PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## ♿ Accessibility audit"
            echo
            echo "| Suite | Result |"
            echo "|---|---|"
            echo "| jest-axe (all page components) | ${{ steps.axe.outcome }} |"
            echo
            echo "Baseline exceptions are tracked in \`docs/accessibility/known-violations.md\`."
            for f in axe-results.json; do
              [ -f "$f" ] || continue
              jq -r '.testResults[].assertionResults[] | select(.status=="failed")
                | "<details><summary>❌ \(.fullName)</summary>\n\n```\n\(.failureMessages | join("\n") | .[0:3000])\n```\n</details>"' "$f"
            done
          } > a11y-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file a11y-comment.md
