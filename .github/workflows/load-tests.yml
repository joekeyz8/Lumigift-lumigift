name: Load Tests

on:
  push:
    branches:
      - main
    paths:
      - 'load-tests/**'
      - '.github/workflows/load-tests.yml'
  pull_request:
    paths:
      - 'load-tests/**'
      - '.github/workflows/load-tests.yml'
  workflow_dispatch:
    inputs:
      baseline_compare:
        description: 'Compare results against committed baseline'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: load-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  K6_VERSION: '0.49.0'
  P95_THRESHOLD_MS: '500'
  ERROR_RATE_THRESHOLD: '0.001'

jobs:
  load-test:
    name: k6 Load Tests (gift create & claim)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gift_load_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build --if-present

      - name: Run database migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/gift_load_test
          REDIS_URL: redis://localhost:6379
        run: npm run migrate --if-present

      - name: Start application
        env:
          NODE_ENV: test
          PORT: '3000'
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/gift_load_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: load-test-secret
          LOAD_TEST_MODE: 'true'
        run: |
          nohup npm start > app.log 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for application to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting for application... ($i/60)"
            sleep 2
          done
          echo "Application failed to become ready"
          cat app.log || true
          exit 1

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      - name: Run k6 load tests
        id: k6
        env:
          BASE_URL: http://localhost:3000
          K6_SUMMARY_EXPORT: load-tests/results/summary.json
          K6_RESULTS_EXPORT: load-tests/results/results.json
        run: |
          mkdir -p load-tests/results
          set +e
          k6 run \
            --out json=load-tests/results/results.json \
            --summary-export=load-tests/results/summary.json \
            load-tests/gift-endpoints.js
          K6_EXIT_CODE=$?
          echo "k6_exit_code=$K6_EXIT_CODE" >> "$GITHUB_OUTPUT"
          set -e
          # Do not fail here; threshold comparison below decides pass/fail.
          exit 0

      - name: Compare results against baseline
        id: compare
        if: ${{ github.event.inputs.baseline_compare != 'false' }}
        env:
          P95_THRESHOLD_MS: ${{ env.P95_THRESHOLD_MS }}
          ERROR_RATE_THRESHOLD: ${{ env.ERROR_RATE_THRESHOLD }}
        run: |
          node load-tests/compare-baseline.js \
            --current load-tests/results/summary.json \
            --baseline load-tests/baseline.json \
            --p95-threshold "$P95_THRESHOLD_MS" \
            --error-rate-threshold "$ERROR_RATE_THRESHOLD"

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            load-tests/results/
            app.log
          retention-days: 30

      - name: Stop application
        if: always()
        run: |
          if [ -n "${APP_PID:-}" ]; then
            kill "$APP_PID" 2>/dev/null || true
          fi
          pkill -f "node" 2>/dev/null || true

      - name: Fail if k6 reported threshold violations
        if: steps.k6.outputs.k6_exit_code != '0'
        run: |
          echo "k6 reported threshold violations (exit code ${{ steps.k6.outputs.k6_exit_code }})"
          exit 1